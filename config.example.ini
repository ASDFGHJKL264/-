; 将本文件复制为程序目录下的 config.ini。
; 新增传感器只需启用对应 Sensor 段并填写地址，无需修改或重新编译代码。

[Serial]
port=COM1
baud=9600
databits=8
parity=无校验
stopbits=1

[Acquisition]
; 每一路完整采样周期，允许范围 100～60000 ms
intervalMs=500
; 没有 RS-485 硬件时改为 true
simulator=false

[Alarm]
tempMin=-20
tempMax=60
humMin=10
humMax=90

[Sensor1]
enabled=true
name=温湿度模块1
slaveId=1
useInputReg=false
tempAddr=0
humAddr=1

[Sensor2]
enabled=false
name=温湿度模块2
slaveId=2
useInputReg=false
tempAddr=0
humAddr=1

[Sensor3]
enabled=false
name=温湿度模块3
slaveId=3
useInputReg=false
tempAddr=0
humAddr=1

[Sensor4]
enabled=false
name=温湿度模块4
slaveId=4
useInputReg=false
tempAddr=0
humAddr=1
